# fly.toml app configuration file for crownflux-io
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'crownflux-io'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  HOST = '0.0.0.0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
