<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#181715">
<meta name="description" content="Crownflux.io — estratégia em tempo real inspirada no xadrez. Evolua seu exército, domine os Fragmentos Flux e vença seus rivais.">
<title>Crownflux.io — Xadrez em Tempo Real</title>
<link rel="stylesheet" href="/styles.css?v=20261118-checkmate">
</head>
<body data-board-theme="classic">
<div id="app">
  <header class="topbar">
    <button class="brand" id="brandHomeBtn" type="button">
      <span class="brand-mark">♛</span>
      <span>CROWNFLUX<span class="io">.io</span></span>
    </button>
    <nav class="main-nav" aria-label="Menu principal">
      <button class="nav-btn primary-nav active" data-nav="play" type="button">Jogar</button>
      <button class="nav-btn" data-nav="guide" type="button">Como jogar</button>
      <button class="nav-btn" data-nav="friends" type="button">
        <span>Amigos</span>
        <span class="nav-badge hidden" id="navFriendsOnlineBadge">0</span>
        <span class="nav-dot hidden" id="navFriendsAlertDot"></span>
      </button>
      <button class="nav-btn" data-nav="profile" type="button">Perfil</button>
      <button class="nav-btn" data-nav="history" type="button">Histórico</button>
      <button class="nav-btn" data-nav="settings" type="button">Configurações</button>
    </nav>
    <div class="top-right">
      <button class="account-pill" id="headerAccountBtn" type="button">
        <span class="mini-avatar" id="headerAvatar">♟</span>
        <span id="headerAccountLabel">Entrar / Conta</span>
      </button>
    </div>
  </header>

  <div id="screenRoot"></div>
</div>
<div id="sharedRoot"></div>
<div id="tacticalRoot"></div>
<script>
(async () => {
  const loadMarkup = async (targetId, url, append = false) => {
    const response = await fetch(url, { cache: "no-cache" });
    if (!response.ok) throw new Error(`Could not load ${url}: ${response.status}`);
    const target = document.getElementById(targetId);
    const markup = await response.text();
    if (append) target.insertAdjacentHTML("beforeend", markup);
    else target.innerHTML = markup;
  };
  for (const screen of ["play", "guide", "friends", "profile", "history", "settings"]) {
    await loadMarkup("screenRoot", `/screens/${screen}.html`, true);
  }
  await loadMarkup("sharedRoot", "/screens/shared.html");
  await loadMarkup("tacticalRoot", "/screens/tactical.html");
  for (const url of ["/app.js?v=20261118-checkmate", "/tactical.js?v=20261118-checkmate"]) {
    await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = url;
      script.onload = resolve;
      script.onerror = () => reject(new Error(`Could not load ${url}`));
      document.body.appendChild(script);
    });
  }
})().catch(error => {
  console.error(error);
  const root = document.getElementById("screenRoot");
  if (root) {
    const notice = document.createElement("section");
    notice.className = "view-page active";
    notice.textContent = `Falha ao carregar o jogo: ${error.message}`;
    root.replaceChildren(notice);
  }
});
</script>
</body>
</html>
